<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タスクボード</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="header">
    <h1>タスクボード</h1>
  </header>

  <main class="main">
    <form id="add-form" class="add-form" novalidate>
      <label for="title-input" class="visually-hidden">カードのタイトル</label>
      <input id="title-input" name="title" type="text" maxlength="50"
             placeholder="タイトルを入力（50文字まで）" autocomplete="off"
             aria-describedby="input-error">
      <button type="submit" id="add-button">追加</button>
    </form>
    <p id="input-error" class="message message-error" role="alert" hidden></p>
    <p id="status-message" class="message" role="status" hidden></p>

    <div class="board" id="board">
      <section class="column column-todo" data-status="todo" aria-labelledby="heading-todo">
        <h2 id="heading-todo">やること<span class="count">（0）</span></h2>
        <ul class="card-list"></ul>
      </section>
      <section class="column column-doing" data-status="doing" aria-labelledby="heading-doing">
        <h2 id="heading-doing">進行中<span class="count">（0）</span></h2>
        <ul class="card-list"></ul>
      </section>
      <section class="column column-done" data-status="done" aria-labelledby="heading-done">
        <h2 id="heading-done">完了<span class="count">（0）</span></h2>
        <ul class="card-list"></ul>
      </section>
    </div>
  </main>
</body>
</html>
